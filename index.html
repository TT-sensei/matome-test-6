<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小6算数 6年生まとめテスト A4大問別特訓プリント集（増量版）</title>
  <style>
    :root {
      --paper-width: 210mm;
      --paper-height: 297mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Yu Gothic UI', Meiryo, 'Noto Sans JP', sans-serif;
      background-color: #cbd5e1;
      color: #111827;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* 縦書き分数（小学校算数テスト準拠） */
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 2px;
      font-size: 0.88em;
      line-height: 1.02;
      font-weight: 600;
    }
    .frac .num {
      border-bottom: 1.25px solid #111827;
      padding: 0 2.5px 1px 2.5px;
      display: block;
      text-align: center;
    }
    .frac .den {
      padding: 1px 2.5px 0 2.5px;
      display: block;
      text-align: center;
    }
    .mixed-num {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin: 0 1px;
    }

    /* 解答欄ボックス（コンパクト高密度版） */
    .ans-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      height: 24px;
      border: 1.4px solid #111827;
      background-color: #ffffff;
      padding: 1px 5px;
      font-weight: 700;
      font-size: 11px;
      vertical-align: middle;
      border-radius: 2px;
    }
    .ans-box-sm {
      min-width: 38px;
      height: 22px;
    }
    .ans-box-md {
      min-width: 82px;
      height: 24px;
    }
    .ans-box-lg {
      min-width: 122px;
      height: 24px;
    }
    .ans-box-xl {
      min-width: 158px;
      height: 24px;
    }

    /* 記述用解答枠（罫線付き） */
    .desc-box {
      border: 1.3px solid #111827;
      background-image: linear-gradient(to bottom, transparent 19px, #cbd5e1 20px);
      background-size: 100% 20px;
      line-height: 20px;
      padding: 1px 6px;
      width: 100%;
      background-color: #ffffff;
      border-radius: 2px;
      font-size: 10px;
      overflow: hidden;
    }

    /* A4用紙レイアウト（厳密 210mm × 297mm / 余白最小・印字幅190mm） */
    .a4-sheet {
      width: var(--paper-width);
      height: var(--paper-height);
      background: #ffffff;
      margin: 14px auto;
      padding: 8mm 10mm 7mm 10mm;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.18);
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      scroll-margin-top: 112px;
    }

    /* スリムヘッダー（約13mm） */
    .sheet-header {
      height: 13mm;
      border-bottom: 1.8px solid #111827;
      padding-bottom: 1.5mm;
      margin-bottom: 2mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .sheet-title-badge {
      background: #111827;
      color: #ffffff;
      font-weight: 700;
      padding: 1px 6px;
      font-size: 10px;
      border-radius: 2px;
      display: inline-block;
      line-height: 1.35;
    }

    .name-table {
      border-collapse: collapse;
      flex-shrink: 0;
    }
    .name-table td {
      border: 1.2px solid #111827;
      padding: 1px 5px;
      font-size: 10px;
      height: 19px;
      line-height: 1;
      white-space: nowrap;
    }

    /* 問題エリア本体（約261mmフル活用） */
    .sheet-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* 圧縮フッター（約6mm） */
    .sheet-footer {
      height: 6mm;
      margin-top: 1.5mm;
      padding-top: 1mm;
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9.5px;
      color: #475569;
      flex-shrink: 0;
    }

    .problem-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1.5px solid #111827;
      font-weight: 800;
      font-size: 11px;
      margin-right: 5px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .q-card {
      border: 1px solid #94a3b8;
      border-radius: 3px;
      background: #ffffff;
      padding: 4px 7px;
      min-height: 0;
      overflow: hidden;
    }

    /* 赤字解答表示トグル */
    .inline-ans-text {
      color: #dc2626;
      font-weight: 700;
    }
    body.hide-inline-ans .inline-ans-text {
      display: none !important;
    }

    /* 教科書・本番テスト品質のSVG共通スタイル */
    .math-svg {
      display: block;
      overflow: visible;
    }
    .svg-outline {
      stroke: #111827;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .svg-thin {
      stroke: #334155;
      stroke-width: 1;
    }
    .svg-hidden {
      stroke: #475569;
      stroke-width: 1.15;
      stroke-dasharray: 3, 2.5;
      fill: none;
    }
    .svg-axis {
      stroke: #111827;
      stroke-width: 1.3;
      stroke-dasharray: 6, 2, 1.5, 2;
    }
    .svg-grid {
      stroke: #d1d5db;
      stroke-width: 0.75;
    }
    .svg-dim-line {
      stroke: #475569;
      stroke-width: 0.95;
      stroke-dasharray: 2.5, 2;
    }
    .svg-label {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Yu Gothic UI', Meiryo, 'Noto Sans JP', sans-serif;
      font-weight: 700;
      fill: #111827;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .svg-vertex {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Yu Gothic UI', Meiryo, 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 10px;
      fill: #111827;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    /* A4印刷専用スタイル */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-wrapper {
        padding: 0 !important;
        overflow: visible !important;
      }
      .a4-sheet {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 8mm 10mm 7mm 10mm !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
        overflow: hidden !important;
      }
      .a4-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .sheet-hidden-by-filter {
        display: none !important;
      }
    }

    /* 小画面での閲覧サポート */
    @media screen and (max-width: 840px) {
      .a4-wrapper {
        overflow-x: auto;
        padding: 0 8px;
      }
      .a4-sheet {
        margin: 10px 0;
      }
    }
  </style>

  <script>
    // =========================================================================
    // 共通ユーティリティ関数（乱数・分数計算・ヘッダー/フッター生成）
    // =========================================================================
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function gcd(a, b) {
      let x = Math.abs(a);
      let y = Math.abs(b);
      while (y !== 0) {
        const t = y;
        y = x % y;
        x = t;
      }
      return x || 1;
    }

    function reduceFrac(n, d) {
      const g = gcd(n, d);
      return { n: n / g, d: d / g };
    }

    function fracHTML(n, d) {
      return `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
    }

    function mixedFracHTML(whole, n, d) {
      return `<span class="mixed-num"><span>${whole}</span>${fracHTML(n, d)}</span>`;
    }

    function reducedFracHTML(n, d) {
      const r = reduceFrac(n, d);
      if (r.d === 1) return `${r.n}`;
      return fracHTML(r.n, r.d);
    }

    function formatFracText(n, d) {
      const r = reduceFrac(n, d);
      if (r.d === 1) return `${r.n}`;
      return `${r.n}/${r.d}`;
    }

    // スリムヘッダー（高さ13mm・印字幅190mm最適化）
    function createSheetHeader(num, title, subtitle, totalPoints) {
      return `
        <div class="sheet-header">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="sheet-title-badge">小6算数 特訓 No.${num}</span>
              <h2 class="text-[13.5px] font-black tracking-tight text-slate-900 truncate">${title}</h2>
            </div>
            <p class="text-[10px] text-slate-600 mt-0.5 truncate">★ポイント：${subtitle}</p>
          </div>
          <table class="name-table">
            <tr>
              <td class="bg-slate-100 font-bold text-center">組・番</td>
              <td class="w-[74px] text-right text-slate-600">組　　番</td>
              <td class="bg-slate-100 font-bold text-center">得点</td>
              <td class="w-[54px] text-right font-bold">／${totalPoints}</td>
            </tr>
            <tr>
              <td class="bg-slate-100 font-bold text-center">名前</td>
              <td colspan="3" class="w-[160px]"></td>
            </tr>
          </table>
        </div>
      `;
    }

    // 圧縮フッター（高さ6mm）
    function createSheetFooter(label) {
      return `
        <div class="sheet-footer">
          <span>6年生まとめテスト（小6算数）・A4大問別反復特訓プリント</span>
          <span class="font-bold text-slate-700">- ${label} -</span>
        </div>
      `;
    }

    // 方眼グリッド生成共通ヘルパー
    function buildGridSVG(w, h, step) {
      let g = '';
      for (let x = 0; x <= w; x += step) {
        g += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" class="svg-grid"/>`;
      }
      for (let y = 0; y <= h; y += step) {
        g += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" class="svg-grid"/>`;
      }
      return g;
    }

    // =========================================================================
    // プリント1：分数の計算（20問・2列×10行）
    // =========================================================================
    function generateSheet1() {
      const problems = [];
      const usedKeys = new Set();

      // (1)〜(5) 分数のかけ算（約分が発生する組）
      while (problems.length < 5) {
        const d1 = pickRandom([4, 5, 6, 7, 8, 9, 10, 12, 14]);
        const d2 = pickRandom([4, 5, 6, 7, 8, 9, 10, 12, 15]);
        const n1 = randInt(2, d1 - 1);
        const n2 = randInt(2, d2 - 1);
        if (gcd(n1, d1) !== 1 || gcd(n2, d2) !== 1) continue;
        if (gcd(n1, d2) === 1 && gcd(n2, d1) === 1) continue;
        const key = `m:${n1}/${d1}*${n2}/${d2}`;
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        const num = n1 * n2;
        const den = d1 * d2;
        problems.push({
          expr: `${fracHTML(n1, d1)} × ${fracHTML(n2, d2)}`,
          ansHTML: reducedFracHTML(num, den),
          ansText: formatFracText(num, den)
        });
      }

      // (6)〜(10) 分数のわり算
      while (problems.length < 10) {
        const d1 = pickRandom([3, 4, 5, 6, 7, 8, 9, 10, 12]);
        const d2 = pickRandom([3, 4, 5, 6, 7, 8, 9, 10]);
        const n1 = randInt(2, d1 - 1);
        const n2 = randInt(2, d2 + 3);
        if (gcd(n1, d1) !== 1 || gcd(n2, d2) !== 1 || n2 === d2) continue;
        const key = `d:${n1}/${d1}/${n2}/${d2}`;
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        const num = n1 * d2;
        const den = d1 * n2;
        problems.push({
          expr: `${fracHTML(n1, d1)} ÷ ${fracHTML(n2, d2)}`,
          ansHTML: reducedFracHTML(num, den),
          ansText: formatFracText(num, den)
        });
      }

      // (11)〜(15) 3つの数の乗除
      for (let i = 0; i < 5; i++) {
        if (i === 0 || i === 4) {
          const k = pickRandom([3, 4, 5, 6]);
          const d1 = k * pickRandom([2, 3]);
          let n1 = randInt(2, d1 - 1);
          while (gcd(n1, d1) !== 1) n1 = randInt(2, d1 - 1);
          const d2 = pickRandom([4, 6, 8, 9]);
          let n2 = randInt(2, d2 + 2);
          while (gcd(n2, d2) !== 1 || n2 === d2) n2 = randInt(2, d2 + 2);
          const num = n1 * n2 * k;
          const den = d1 * d2;
          problems.push({
            expr: i === 0
              ? `${fracHTML(n1, d1)} × ${fracHTML(n2, d2)} × ${k}`
              : `${k} × ${fracHTML(n1, d1)} × ${fracHTML(n2, d2)}`,
            ansHTML: reducedFracHTML(num, den),
            ansText: formatFracText(num, den)
          });
        } else if (i === 1) {
          const k = pickRandom([2, 3, 4]);
          const n1 = k * pickRandom([2, 3]);
          let d1 = n1 + pickRandom([5, 7, 9]);
          while (gcd(n1, d1) !== 1) d1++;
          const d2 = pickRandom([3, 5, 6, 7]);
          let n2 = randInt(2, d2 - 1);
          while (gcd(n2, d2) !== 1) n2 = randInt(2, d2 - 1);
          const num = n1 * n2;
          const den = d1 * k * d2;
          problems.push({
            expr: `${fracHTML(n1, d1)} ÷ ${k} × ${fracHTML(n2, d2)}`,
            ansHTML: reducedFracHTML(num, den),
            ansText: formatFracText(num, den)
          });
        } else if (i === 2) {
          const d1 = pickRandom([4, 5, 6, 8, 9]);
          let n1 = randInt(2, d1 - 1);
          while (gcd(n1, d1) !== 1) n1 = randInt(2, d1 - 1);
          const d2 = pickRandom([3, 5, 7, 8]);
          let n2 = randInt(2, d2 - 1);
          while (gcd(n2, d2) !== 1) n2 = randInt(2, d2 - 1);
          const d3 = pickRandom([3, 4, 6, 8]);
          let n3 = randInt(2, d3 - 1);
          while (gcd(n3, d3) !== 1) n3 = randInt(2, d3 - 1);
          const num = n1 * n2 * d3;
          const den = d1 * d2 * n3;
          problems.push({
            expr: `${fracHTML(n1, d1)} × ${fracHTML(n2, d2)} ÷ ${fracHTML(n3, d3)}`,
            ansHTML: reducedFracHTML(num, den),
            ansText: formatFracText(num, den)
          });
        } else {
          const d1 = pickRandom([3, 4, 5, 6, 8]);
          let n1 = randInt(2, d1 - 1);
          while (gcd(n1, d1) !== 1) n1 = randInt(2, d1 - 1);
          const d2 = pickRandom([3, 4, 5, 7]);
          let n2 = randInt(2, d2 - 1);
          while (gcd(n2, d2) !== 1) n2 = randInt(2, d2 - 1);
          const d3 = pickRandom([4, 5, 6, 9]);
          let n3 = randInt(2, d3 - 1);
          while (gcd(n3, d3) !== 1) n3 = randInt(2, d3 - 1);
          const num = n1 * d2 * n3;
          const den = d1 * n2 * d3;
          problems.push({
            expr: `${fracHTML(n1, d1)} ÷ ${fracHTML(n2, d2)} × ${fracHTML(n3, d3)}`,
            ansHTML: reducedFracHTML(num, den),
            ansText: formatFracText(num, den)
          });
        }
      }

      // (16)〜(20) 分配法則の工夫
      for (let i = 0; i < 5; i++) {
        const isAdd = i % 2 === 0;
        const b = pickRandom([5, 7, 8, 9, 11, 13, 14, 15]);
        let a = randInt(2, b - 1);
        while (gcd(a, b) !== 1) a = randInt(2, b - 1);
        const d = pickRandom([5, 6, 7, 8, 9]);
        const m = pickRandom([1, 2]);
        let c, e;
        if (isAdd) {
          e = randInt(1, d - 1);
          while (gcd(e, d) !== 1) e = randInt(1, d - 1);
          c = d * m - e;
          if (c <= 0 || c % d === 0) {
            e = 1;
            c = d * m - 1;
          }
        } else {
          e = randInt(2, d - 1);
          while (gcd(e, d) !== 1) e = randInt(2, d - 1);
          c = d * m + e;
        }
        const op = isAdd ? '＋' : '－';
        const num = a * m;
        const den = b;
        problems.push({
          expr: `${fracHTML(a, b)} × ${fracHTML(c, d)} ${op} ${fracHTML(a, b)} × ${fracHTML(e, d)}`,
          ansHTML: reducedFracHTML(num, den),
          ansText: formatFracText(num, den)
        });
      }

      return {
        html: `
          <section class="a4-sheet" id="sheet-1" data-unit="1">
            ${createSheetHeader(1, '【大問1特訓】分数の計算（乗除・3数の計算・分配法則・全20問）', '途中でしっかり約分しよう！(16)〜(20)は同じ分数でまとめる工夫を使おう！', 20)}
            <div class="sheet-body">
              <div class="text-[11.5px] font-bold flex items-center shrink-0">
                <span class="problem-num">1</span>
                <span>次の計算をしなさい。答えが約分できるときは、いちばん簡単な分数で答えなさい。（途中式は空いているスペースに書くこと）</span>
              </div>
              <div class="grid grid-cols-2 gap-x-2.5 gap-y-1.5 flex-1 min-h-0" style="grid-template-rows: repeat(10, minmax(0, 1fr));">
                ${problems.map((p, idx) => `
                  <div class="q-card flex items-center justify-between gap-1.5">
                    <div class="flex items-center text-[12px] leading-none">
                      <span class="font-bold mr-1.5 text-[10.5px] text-slate-700">(${idx + 1})</span>
                      <span>${p.expr}</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <span class="text-[10px] text-slate-300 select-none">＝</span>
                      <div class="ans-box"><span class="inline-ans-text">${p.ansHTML}</span></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ${createSheetFooter('1')}
          </section>
        `,
        answerSection: `
          <div class="mb-2">
            <h4 class="font-bold text-[11px] bg-slate-100 px-2 py-0.5 border-l-4 border-slate-800 mb-1">プリント1【分数の計算（全20問）】</h4>
            <div class="grid grid-cols-5 gap-x-2 gap-y-0.5 text-[10.5px]">
              ${problems.map((p, i) => `<div>(${i + 1}) ${p.ansText}</div>`).join('')}
            </div>
          </div>
        `
      };
    }

    // =========================================================================
    // プリント2：積や商の大きさ比べ（12問・2列×6行）
    // =========================================================================
    function generateSheet2() {
      const labels = ['ア', 'イ', 'ウ', 'エ', 'オ'];
      const sq = '<span class="inline-block w-3.5 h-3.5 border-[1.4px] border-slate-900 align-middle mx-0.5 bg-white"></span>';
      const questions = [];

      const properFracs = [
        { n: 2, d: 3 }, { n: 3, d: 4 }, { n: 3, d: 5 }, { n: 4, d: 5 },
        { n: 5, d: 6 }, { n: 4, d: 7 }, { n: 5, d: 8 }, { n: 7, d: 9 }
      ];
      const improperFracs = [
        { n: 5, d: 4 }, { n: 6, d: 5 }, { n: 7, d: 5 }, { n: 8, d: 5 },
        { n: 7, d: 6 }, { n: 9, d: 7 }, { n: 11, d: 8 }
      ];
      const mixedFracs = [
        { w: 1, n: 1, d: 3 }, { w: 1, n: 2, d: 5 }, { w: 2, n: 1, d: 3 },
        { w: 1, n: 3, d: 4 }, { w: 2, n: 1, d: 2 }
      ];
      const smallDecs = [0.2, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95];
      const largeDecs = [1.1, 1.2, 1.4, 1.5, 2.3];

      for (let i = 0; i < 12; i++) {
        const findLarger = i % 2 === 0;
        const pf1 = pickRandom(properFracs);
        const pf2 = pickRandom(properFracs.filter(f => f.n !== pf1.n || f.d !== pf1.d));
        const imp = pickRandom(improperFracs);
        const mix = pickRandom(mixedFracs);
        const sDec = pickRandom(smallDecs);
        const lDec = pickRandom(largeDecs);

        const pool = [
          { html: `${sq}×${fracHTML(pf1.n, pf1.d)}`, isLarger: false, isSmaller: true },
          { html: `${sq}×${fracHTML(imp.n, imp.d)}`, isLarger: true, isSmaller: false },
          { html: `${sq}÷${fracHTML(pf2.n, pf2.d)}`, isLarger: true, isSmaller: false },
          { html: `${sq}÷${mixedFracHTML(mix.w, mix.n, mix.d)}`, isLarger: false, isSmaller: true }
        ];

        const fifthType = i % 5;
        if (fifthType === 0) {
          pool.push({ html: `${sq}÷${sDec}`, isLarger: true, isSmaller: false });
        } else if (fifthType === 1) {
          pool.push({ html: `${sq}×${sDec}`, isLarger: false, isSmaller: true });
        } else if (fifthType === 2) {
          pool.push({ html: `${sq}÷1`, isLarger: false, isSmaller: false });
        } else if (fifthType === 3) {
          pool.push({ html: `${sq}÷${lDec}`, isLarger: false, isSmaller: true });
        } else {
          pool.push({ html: `${sq}×1`, isLarger: false, isSmaller: false });
        }

        const opts = shuffle(pool);
        const correctLabels = [];
        opts.forEach((o, idx) => {
          if (findLarger ? o.isLarger : o.isSmaller) correctLabels.push(labels[idx]);
        });

        questions.push({
          targetText: findLarger ? '大きく' : '小さく',
          opts,
          ansText: correctLabels.join('、')
        });
      }

      return {
        html: `
          <section class="a4-sheet" id="sheet-2" data-unit="2">
            ${createSheetHeader(2, '【大問2特訓】積や商の大きさ比べ（全て選ぶ問題・全12問）', '1より小さい数をかけると小さく、1より小さい数でわると大きくなる！×1・÷1は等しい！', 12)}
            <div class="sheet-body">
              <div class="text-[11.5px] font-bold flex items-center shrink-0">
                <span class="problem-num">2</span>
                <span>次の(1)〜(12)で、${sq} の中には 0 より大きい同じ数が入ります。条件にあう式をア〜オの中から<span class="underline">全て</span>選びなさい。</span>
              </div>
              <div class="grid grid-cols-2 gap-x-2.5 gap-y-2 flex-1 min-h-0" style="grid-template-rows: repeat(6, minmax(0, 1fr));">
                ${questions.map((q, idx) => `
                  <div class="q-card flex flex-col justify-between">
                    <div class="flex items-center justify-between gap-1 text-[10.5px]">
                      <div>
                        <span class="font-bold mr-1">(${idx + 1})</span>
                        ${sq}より <span class="font-black underline text-[11px]">${q.targetText}なるもの</span>
                      </div>
                      <div class="ans-box ans-box-md shrink-0"><span class="inline-ans-text">${q.ansText}</span></div>
                    </div>
                    <div class="grid grid-cols-3 gap-x-1 gap-y-0.5 text-[11px] items-center pt-1 border-t border-slate-100">
                      ${q.opts.map((o, j) => `
                        <div class="flex items-center gap-0.5 whitespace-nowrap">
                          <span class="font-bold text-[10px]">${labels[j]}</span>
                          <span>${o.html}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ${createSheetFooter('2')}
          </section>
        `,
        answerSection: `
          <div class="mb-2">
            <h4 class="font-bold text-[11px] bg-slate-100 px-2 py-0.5 border-l-4 border-slate-800 mb-1">プリント2【積や商の大きさ比べ（全12問）】</h4>
            <div class="grid grid-cols-4 gap-x-2 gap-y-0.5 text-[10.5px]">
              ${questions.map((q, i) => `<div>(${i + 1}) ${q.ansText}</div>`).join('')}
            </div>
          </div>
        `
      };
    }

    // =========================================================================
    // プリント3：数直線と分数の立式（6大問・2列×3行・小問計16問）
    // =========================================================================
    function generateSheet3() {
      const scenarios = [
        { item: '鉄のパイプ', unitA: 'kg', unitB: 'm', labelA: '重さ', labelB: '長さ' },
        { item: 'ペンキ', unitA: 'm²', unitB: 'dL', labelA: 'ぬれる面積', labelB: 'ペンキの量' },
        { item: 'リボン', unitA: 'm', unitB: '分', labelA: 'できた長さ', labelB: '時間' },
        { item: '針金', unitA: 'g', unitB: 'm', labelA: '重さ', labelB: '長さ' }
      ];

      const blocks = [];
      const ansAll = [];

      // [1]〜[4] 数直線SVG付き（各3小問＝12小問）
      for (let i = 0; i < 4; i++) {
        const sc = scenarios[i];
        const dB = pickRandom([3, 4, 5, 7, 8]);
        let nB = randInt(2, dB - 1);
        while (gcd(nB, dB) !== 1) nB = randInt(2, dB - 1);

        const dA = pickRandom([3, 4, 5, 6, 7, 9]);
        let nA = randInt(2, dA + 2);
        while (gcd(nA, dA) !== 1 || nA === dA) nA = randInt(2, dA + 2);

        const formulaAns = `${reducedFracHTML(nA, dA)} ÷ ${reducedFracHTML(nB, dB)}`;
        const valAns = reducedFracHTML(nA * dB, dA * nB);
        const ratio = Math.min(Math.max(nB / dB, 0.28), 0.72);
        const midX = Math.round(58 + (204 - 58) * ratio);

        ansAll.push(`[${i + 1}] (1) ア:${formatFracText(nA, dA)}, イ:${formatFracText(nB, dB)} (2) ${formatFracText(nA, dA)}÷${formatFracText(nB, dB)} (3) ${formatFracText(nA * dB, dA * nB)}${sc.unitA}`);

        blocks.push(`
          <div class="q-card flex flex-col justify-between">
            <div class="text-[10.5px] leading-snug">
              <span class="font-bold mr-0.5">[${i + 1}]</span>
              ${fracHTML(nB, dB)}${sc.unitB}で${sc.labelA}が${fracHTML(nA, dA)}${sc.unitA}の${sc.item}。1${sc.unitB}あたりの${sc.labelA}を求める。
            </div>
            <div class="flex justify-center my-0.5">
              <svg width="246" height="72" viewBox="0 0 246 72" class="math-svg">
                <text x="2" y="21" font-size="8.5" class="svg-label">${sc.labelA}</text>
                <text x="2" y="30" font-size="8" fill="#475569">(${sc.unitA})</text>
                <line x1="50" y1="24" x2="236" y2="24" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-end)"/>
                <line x1="58" y1="19" x2="58" y2="29" stroke="#111827" stroke-width="1.4"/>
                <line x1="${midX}" y1="19" x2="${midX}" y2="29" stroke="#111827" stroke-width="1.4"/>
                <line x1="204" y1="19" x2="204" y2="29" stroke="#111827" stroke-width="1.4"/>
                <text x="58" y="14" font-size="9" text-anchor="middle" class="svg-label">0</text>
                <rect x="${midX - 11}" y="2" width="22" height="14" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
                <text x="${midX}" y="12" font-size="9" text-anchor="middle" font-weight="bold">ア</text>
                <rect x="193" y="2" width="22" height="14" rx="2" fill="#f1f5f9" stroke="#111827" stroke-width="1.1" stroke-dasharray="2,1.5"/>
                <text x="204" y="12" font-size="9.5" text-anchor="middle" font-weight="bold">□</text>

                <line x1="58" y1="29" x2="58" y2="46" class="svg-dim-line"/>
                <line x1="${midX}" y1="29" x2="${midX}" y2="46" class="svg-dim-line"/>
                <line x1="204" y1="29" x2="204" y2="46" class="svg-dim-line"/>

                <text x="2" y="51" font-size="8.5" class="svg-label">${sc.labelB}</text>
                <text x="2" y="60" font-size="8" fill="#475569">(${sc.unitB})</text>
                <line x1="50" y1="51" x2="236" y2="51" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-end)"/>
                <line x1="58" y1="46" x2="58" y2="56" stroke="#111827" stroke-width="1.4"/>
                <line x1="${midX}" y1="46" x2="${midX}" y2="56" stroke="#111827" stroke-width="1.4"/>
                <line x1="204" y1="46" x2="204" y2="56" stroke="#111827" stroke-width="1.4"/>
                <text x="58" y="68" font-size="9" text-anchor="middle" class="svg-label">0</text>
                <rect x="${midX - 11}" y="57" width="22" height="13" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
                <text x="${midX}" y="67" font-size="9" text-anchor="middle" font-weight="bold">イ</text>
                <text x="204" y="68" font-size="9.5" text-anchor="middle" class="svg-label">1</text>
              </svg>
            </div>
            <div class="space-y-1 text-[10px]">
              <div class="flex items-center justify-between">
                <span>(1) ア・イの数：</span>
                <div class="flex items-center gap-1">ア<div class="ans-box ans-box-sm"><span class="inline-ans-text">${reducedFracHTML(nA, dA)}</span></div> イ<div class="ans-box ans-box-sm"><span class="inline-ans-text">${reducedFracHTML(nB, dB)}</span></div></div>
              </div>
              <div class="flex items-center justify-between">
                <span>(2) □を求める式：</span>
                <div class="ans-box ans-box-md"><span class="inline-ans-text">${formulaAns}</span></div>
              </div>
              <div class="flex items-center justify-between">
                <span>(3) 実際の答え：</span>
                <div><div class="ans-box ans-box-sm"><span class="inline-ans-text">${valAns}</span></div> ${sc.unitA}</div>
              </div>
            </div>
          </div>
        `);
      }

      // [5] 文章から「何倍か」の立式と答え（2小問）
      const d5a = pickRandom([3, 4, 5, 7]);
      let n5a = randInt(2, d5a + 2);
      while (gcd(n5a, d5a) !== 1 || n5a === d5a) n5a = randInt(2, d5a + 2);
      const d5b = pickRandom([4, 5, 6, 8, 9]);
      let n5b = randInt(2, d5b - 1);
      while (gcd(n5b, d5b) !== 1) n5b = randInt(2, d5b - 1);
      const ans5a = reduceFrac(n5a * d5b, d5a * n5b);
      const ans5b = reduceFrac(n5b * d5a, d5b * n5a);
      ansAll.push(`[5] (1) 式:${formatFracText(n5a, d5a)}÷${formatFracText(n5b, d5b)} 答え:${formatFracText(ans5a.n, ans5a.d)}倍　(2) 式:${formatFracText(n5b, d5b)}÷${formatFracText(n5a, d5a)} 答え:${formatFracText(ans5b.n, ans5b.d)}倍`);

      blocks.push(`

          <div class="text-[10.5px] leading-snug">
            <span class="font-bold mr-0.5">[5]</span>
            赤いテープは ${fracHTML(n5a, d5a)}m、白いテープは ${fracHTML(n5b, d5b)}m です。次の(1)、(2)の式と答えを書きなさい。
          </div>
          <div class="space-y-2 text-[10px] my-1">
            <div class="border border-slate-200 rounded p-1.5 bg-slate-50/50">
              <div class="mb-1">(1) 赤いテープは、白いテープの<span class="font-bold underline">何倍</span>ですか。</div>
              <div class="flex items-center justify-between gap-1">
                <div>式：<div class="ans-box ans-box-md"><span class="inline-ans-text">${fracHTML(n5a, d5a)}÷${fracHTML(n5b, d5b)}</span></div></div>
                <div>答：<div class="ans-box ans-box-sm"><span class="inline-ans-text">${reducedFracHTML(ans5a.n, ans5a.d)}</span></div>倍</div>
              </div>
            </div>
            <div class="border border-slate-200 rounded p-1.5 bg-slate-50/50">
              <div class="mb-1">(2) 白いテープは、赤いテープの<span class="font-bold underline">何倍</span>ですか。</div>
              <div class="flex items-center justify-between gap-1">
                <div>式：<div class="ans-box ans-box-md"><span class="inline-ans-text">${fracHTML(n5b, d5b)}÷${fracHTML(n5a, d5a)}</span></div></div>
                <div>答：<div class="ans-box ans-box-sm"><span class="inline-ans-text">${reducedFracHTML(ans5b.n, ans5b.d)}</span></div>倍</div>
              </div>
            </div>
          </div>
        </div>
      `);

      // [6] かけ算・わり算の使い分け（ロープ3題＝3小問）
      const d6 = pickRandom([5, 7, 9, 11, 14]);
      let n6 = randInt(2, d6 - 2);
      while (gcd(n6, d6) !== 1) n6 = randInt(2, d6 - 2);
      const m6 = pickRandom([2, 3, 4]);
      ansAll.push(`[6] (1) ${formatFracText(n6, d6)}×${m6}　(2) ${m6}÷${formatFracText(n6, d6)}　(3) ${formatFracText(n6, d6)}÷${m6}`);

      blocks.push(`
        <div class="q-card flex flex-col justify-between">
          <div class="text-[10.5px] leading-snug">
            <span class="font-bold mr-0.5">[6]</span>
            1mの重さが ${fracHTML(n6, d6)}kg の黒いロープと、${m6}mの重さが ${fracHTML(n6, d6)}kg の白いロープがあります。次の式を書きなさい。（計算不要）
          </div>
          <div class="space-y-1.5 text-[10px]">
            <div class="flex items-center justify-between gap-1">
              <span>(1) 黒いロープ ${m6}mの重さは何kgか</span>
              <div class="ans-box ans-box-md"><span class="inline-ans-text">${fracHTML(n6, d6)} × ${m6}</span></div>
            </div>

    function generateSheet5() {
      const n1 = pickRandom([4, 5]);
      const ans1 = n1 === 4 ? 24 : 120;
      const n2 = pickRandom([5, 6, 7, 8]);
      const ans2 = (n2 * (n2 - 1)) / 2;
      const n3 = pickRandom([5, 6, 7]);
      const ans3 = n3; // n個からn-1個選ぶ
      const digits4 = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 4).sort();
      const ans4 = 4 * 3 * 2;
      const digits5 = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 3).sort();
      const ans5 = 3 * 3 * 2; // 0を含む4枚から3けた
      const flagN = pickRandom([4, 5, 6]);
      const ans6 = flagN * (flagN - 1);
      const teamN = pickRandom([5, 6, 7]);
      const ans7 = (teamN * (teamN - 1)) / 2;

      const splitCase = pickRandom([
        { total: 5, g1: 3, g2: 2, names: 'A〜E', ans: 10 },
        { total: 6, g1: 4, g2: 2, names: 'A〜F', ans: 15 },
        { total: 7, g1: 5, g2: 2, names: 'A〜G', ans: 21 }
      ]);

      const c100 = randInt(2, 3), c50 = randInt(2, 3), c10 = randInt(3, 5);
      const money9 = c100 * 100 + 50 + randInt(1, 2) * 10;
      let ways9 = 0;
      for (let a = 0; a <= c100; a++) {
        for (let b = 0; b <= c50; b++) {
          for (let c = 0; c <= c10; c++) {
            if (a * 100 + b * 50 + c * 10 === money9) ways9++;
          }
        }
      }

      const menuA = randInt(3, 5), menuB = randInt(2, 4);
      const ans10 = menuA * menuB;

      const iceN = pickRandom([5, 6]);
      const ans11 = (iceN * (iceN - 1) * (iceN - 2)) / 6;

      const lockN = pickRandom([3, 4, 5]);
      const ans12 = lockN * lockN;

      const qs = [
        { q: `${n1}人の児童がリレーで走る順序を決めます。全部で何通りありますか。`, unit: '通り', ans: ans1 },

        { q: `${n3}種類のアイスから ${n3 - 1}種類を選びます。選び方は何通りですか。`, unit: '通り', ans: ans3 },
        { q: `[${digits4.join('][')}] の4枚のカードから3枚を並べて3けたの整数を作ります。何個できますか。`, unit: '個', ans: ans4 },
        { q: `[0][${digits5.join('][')}] の4枚のカードから3枚を並べて3けたの整数を作ります。何個できますか。`, unit: '個', ans: ans5 },
        { q: `${flagN}色の旗から2色を選び、左と右に1本ずつ立てます。立て方は何通りですか。`, unit: '通り', ans: ans6 },
        { q: `${teamN}人の班から、掃除当番を2人選びます。選び方は何通りですか。`, unit: '通り', ans: ans7 },
        { q: `${splitCase.names}の${splitCase.total}人を、${splitCase.g1}人と${splitCase.g2}人の2組に分けます。分け方は何通りですか。`, unit: '通り', ans: splitCase.ans },
        { q: `100円玉${c100}枚、50円玉${c50}枚、10円玉${c10}枚で ${money9}円を払う方法は何通りですか。`, unit: '通り', ans: ways9 },
        { q: `パンが${menuA}種類、飲み物が${menuB}種類あります。1つずつ選ぶ組み合わせは何通りですか。`, unit: '通り', ans: ans10 },
        { q: `${iceN}種類の果物の中から、ちがう3種類を選んで盛り合わせます。何通りですか。`, unit: '通り', ans: ans11 },
        { q: `1〜${lockN}の数字を使って、同じ数字を何回使ってもよい2けたの暗証番号は何通りですか。`, unit: '通り', ans: ans12 }
      ];

      return {
        html: `
          <section class="a4-sheet" id="sheet-5" data-unit="5">

                      <span class="text-[10.5px] font-bold">${item.unit}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ${createSheetFooter('5')}
          </section>
        `,
        answerSection: `
          <div class="mb-2">
            <h4 class="font-bold text-[11px] bg-slate-100 px-2 py-0.5 border-l-4 border-slate-800 mb-1">プリント5【場合の数（全12問）】</h4>

    // =========================================================================
    // プリント6：比と比の利用（全10問：上段2列×3行＝6問、下段2列×2行＝4問）
    // =========================================================================
    function generateSheet6() {
      const labels = ['ア', 'イ', 'ウ', 'エ', 'オ'];
      const baseRatios = [
        { a: 2, b: 3 }, { a: 3, b: 4 }, { a: 2, b: 5 }, { a: 5, b: 8 }, { a: 3, b: 5 }, { a: 4, b: 7 }
      ];
      const chosen = shuffle(baseRatios).slice(0, 4);

      function makeSelectCard(idx, mode, r) {
        const m1 = randInt(2, 3), m2 = randInt(4, 5), m3 = randInt(6, 7);
        const opts = shuffle([
          { text: `${r.a * m1}:${r.b * m1}`, ok: true },
          { text: `${r.a * m2}:${r.b * m2}`, ok: true },
          { text: `${r.a * m3}:${r.b * m3}`, ok: true },
          { text: `${r.b}:${r.a}`, ok: false },
          { text: `${r.a + 2}:${r.b + 2}`, ok: false }
        ]);
        const corr = [];
        const optHTML = opts.map((o, i) => {
          if (o.ok) corr.push(labels[i]);
          return `<span><b>${labels[i]}</b> ${o.text}</span>`;
        }).join('');
        const qText = mode === 'val'
          ? `比の値が ${fracHTML(r.a, r.b)} となる比を<span class="underline font-bold">全て</span>選びなさい。`

    // =========================================================================
    // 角柱の見取図 共通ヘルパー（外向き法線ベクトルによる見える面・隠れ線自動判定）
    // =========================================================================
    function prismDrawing(P, d, label, labelPos) {
      const n = P.length;
      const Q = P.map(([x, y]) => [x + d[0], y + d[1]]);
      let area = 0;
      for (let i = 0; i < n; i++) {
        const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % n];
        area += x1 * y2 - x2 * y1;
      }
      const sg = area > 0 ? 1 : -1;
      const vis = P.map((p, i) => {
        const q = P[(i + 1) % n];
        const nx = sg * (q[1] - p[1]), ny = -sg * (q[0] - p[0]);
        return nx * d[0] + ny * d[1] > 0;
      });
      const pt = a => a.map(v => v.join(',')).join(' ');
      let s = '';
      // 見える側面（先に描く）
      P.forEach((p, i) => {
        if (vis[i]) {
          const j = (i + 1) % n;
          s += `<polygon points="${pt([P[i], P[j], Q[j], Q[i]])}" fill="#ffffff" class="svg-outline"/>`;
        }
      });
      // 前面（底面）
      s += `<polygon points="${pt(P)}" fill="url(#dot-pattern)" class="svg-outline"/>`;
      // 隠れ線（破線）
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, prev = (i - 1 + n) % n;
        if (!vis[prev] && !vis[i]) {
          s += `<line x1="${P[i][0]}" y1="${P[i][1]}" x2="${Q[i][0]}" y2="${Q[i][1]}" class="svg-hidden"/>`;
        }
        if (!vis[i]) {
          s += `<line x1="${Q[i][0]}" y1="${Q[i][1]}" x2="${Q[j][0]}" y2="${Q[j][1]}" class="svg-hidden"/>`;
        }
      }
      s += `<text x="${labelPos[0]}" y="${labelPos[1]}" font-size="8.5" text-anchor="middle" class="svg-label">${label}</text>`;
      return s;
    }

    // =========================================================================
    // プリント11：角柱の体積と説明問題（全4大問・縦4段）
    // =========================================================================
    function generateSheet11() {
      // 大問1：台形柱
      const top1 = randInt(3, 5);
      const bot1 = top1 + randInt(3, 5);
      const hBase1 = pickRandom([4, 6]);
      const hPrism1 = randInt(2, 5);
      const area1 = ((top1 + bot1) * hBase1) / 2;
      const vol1 = area1 * hPrism1;
      const exp1 = `底面の台形の面積は(${top1}＋${bot1})×${hBase1}÷2＝${area1}(cm²)。角柱の体積は「底面積×高さ」なので、${area1}×${hPrism1}＝${vol1} になります。`;

      const sc1p = Math.min(52 / bot1, 38 / hBase1);
      const bw1 = bot1 * sc1p, tw1 = top1 * sc1p, bh1 = hBase1 * sc1p;
      const fx1 = 10, fy1 = 72, off1 = (bw1 - tw1) / 2;
      const prism1 = prismDrawing(
        [[fx1, fy1], [fx1 + bw1, fy1], [fx1 + bw1 - off1, fy1 - bh1], [fx1 + off1, fy1 - bh1]],
        [18, -12], `高さ${hPrism1}cm`, [fx1 + bw1 + 14, fy1 + 11]
      );
      const s1 = Math.min(72 / bot1, 44 / hBase1);
      const bx1 = 16, by1 = 70;
      const tl1 = bx1 + (bot1 - top1) * s1 / 2, tt1 = by1 - hBase1 * s1;
      const base1 = `
        <polygon points="${bx1},${by1} ${bx1 + bot1 * s1},${by1} ${tl1 + top1 * s1},${tt1} ${tl1},${tt1}" fill="url(#diagonal-hatch)" class="svg-outline"/>
        <line x1="${tl1}" y1="${tt1}" x2="${tl1}" y2="${by1}" class="svg-hidden"/>
        <polyline points="${tl1},${by1 - 6} ${tl1 + 6},${by1 - 6} ${tl1 + 6},${by1}" fill="none" stroke="#111827" stroke-width="1"/>
        <text x="${tl1 + top1 * s1 / 2}" y="${tt1 - 3}" font-size="8.5" text-anchor="middle" class="svg-label">${top1}cm</text>
        <text x="${bx1 + bot1 * s1 / 2}" y="${by1 + 11}" font-size="8.5" text-anchor="middle" class="svg-label">${bot1}cm</text>
        <text x="${tl1 + 3}" y="${(tt1 + by1) / 2 + 3}" font-size="8.5" class="svg-label">${hBase1}cm</text>
      `;

      // 大問2：L字柱
      const wOuter = randInt(6, 8);
      const hOuter = randInt(5, 7);
      const wCut = randInt(2, 3);
      const hCut = randInt(2, 3);
      const hPrism2 = randInt(3, 6);
      const area2 = wOuter * hOuter - wCut * hCut;
      const vol2 = area2 * hPrism2;
      const exp2 = `底面の面積は大きな長方形から欠けた部分をひき、${wOuter}×${hOuter}－${wCut}×${hCut}＝${area2}(cm²)。高さ${hPrism2}cmをかけて、${area2}×${hPrism2}＝${vol2} になります。`;

      const sc2 = Math.min(48 / wOuter, 38 / hOuter);
      const W2 = wOuter * sc2, H2 = hOuter * sc2, wc = wCut * sc2, hc = hCut * sc2;
      const fx2 = 10, fy2 = 72;
      const prism2 = prismDrawing(
        [[fx2, fy2 - H2], [fx2 + W2 - wc, fy2 - H2], [fx2 + W2 - wc, fy2 - H2 + hc], [fx2 + W2, fy2 - H2 + hc], [fx2 + W2, fy2], [fx2, fy2]],
        [16, -11], `高さ${hPrism2}cm`, [fx2 + W2 + 13, fy2 + 11]
      );
      const s2 = Math.min(58 / wOuter, 44 / hOuter);
      const bx2 = 22, by2 = 70, BW2 = wOuter * s2, BH2 = hOuter * s2, bwc = wCut * s2, bhc = hCut * s2;
      const base2 = `
        <polygon points="${bx2},${by2 - BH2} ${bx2 + BW2 - bwc},${by2 - BH2} ${bx2 + BW2 - bwc},${by2 - BH2 + bhc} ${bx2 + BW2},${by2 - BH2 + bhc} ${bx2 + BW2},${by2} ${bx2},${by2}" fill="url(#diagonal-hatch)" class="svg-outline"/>
        <polyline points="${bx2 + BW2 - bwc},${by2 - BH2} ${bx2 + BW2},${by2 - BH2} ${bx2 + BW2},${by2 - BH2 + bhc}" class="svg-dim-line" fill="none"/>
        <polyline points="${bx2},${by2 - 5} ${bx2 + 5},${by2 - 5} ${bx2 + 5},${by2}" fill="none" stroke="#111827" stroke-width="1"/>
        <text x="${bx2 - 3}" y="${by2 - BH2 / 2 + 3}" font-size="8.5" text-anchor="end" class="svg-label">${hOuter}cm</text>
        <text x="${bx2 + BW2 / 2}" y="${by2 + 11}" font-size="8.5" text-anchor="middle" class="svg-label">${wOuter}cm</text>
        <text x="${bx2 + BW2 - bwc / 2}" y="${by2 - BH2 - 3}" font-size="8" text-anchor="middle" class="svg-label">${wCut}cm</text>
        <text x="${bx2 + BW2 + 2}" y="${by2 - BH2 + bhc / 2 + 3}" font-size="8" class="svg-label">${hCut}cm</text>
      `;

      // 大問3：五角柱（長方形＋三角形）
      const wRect = randInt(4, 6);
      const hRect = randInt(3, 5);
      const hTri = pickRandom([2, 4]);
      const hPrism3 = randInt(3, 6);
      const area3 = wRect * hRect + (wRect * hTri) / 2;
      const vol3 = area3 * hPrism3;
      const exp3 = `底面の五角形を長方形と三角形に分けると、${wRect}×${hRect}＋${wRect}×${hTri}÷2＝${area3}(cm²)。高さ${hPrism3}cmをかけて、${area3}×${hPrism3}＝${vol3} になります。`;

      const sc3 = Math.min(46 / wRect, 44 / (hRect + hTri));
      const W3 = wRect * sc3, R3 = hRect * sc3, T3 = hTri * sc3;
      const fx3 = 12, fy3 = 73;
      const prism3 = prismDrawing(
        [[fx3, fy3], [fx3 + W3, fy3], [fx3 + W3, fy3 - R3], [fx3 + W3 / 2, fy3 - R3 - T3], [fx3, fy3 - R3]],
        [16, -9], `高さ${hPrism3}cm`, [fx3 + W3 + 13, fy3 + 11]
      );
      const cx3 = 54, s3 = Math.min(58 / wRect, 45 / (hRect + hTri));
      const W3b = wRect * s3, R3b = hRect * s3, T3b = hTri * s3;
      const bx3b = cx3 - W3b / 2, yr3b = 70 - R3b, ya3b = yr3b - T3b;
      const base3 = `
        <polygon points="${bx3b},70 ${bx3b + W3b},70 ${bx3b + W3b},${yr3b} ${cx3},${ya3b} ${bx3b},${yr3b}" fill="url(#diagonal-hatch)" class="svg-outline"/>
        <line x1="${bx3b}" y1="${yr3b}" x2="${bx3b + W3b}" y2="${yr3b}" class="svg-hidden"/>
        <line x1="${cx3}" y1="${ya3b}" x2="${cx3}" y2="${yr3b}" class="svg-hidden"/>
        <polyline points="${cx3},${yr3b - 5} ${cx3 + 5},${yr3b - 5} ${cx3 + 5},${yr3b}" fill="none" stroke="#111827" stroke-width="1"/>
        <text x="${cx3}" y="81" font-size="8.5" text-anchor="middle" class="svg-label">${wRect}cm</text>
        <text x="${bx3b - 3}" y="${(yr3b + 70) / 2 + 3}" font-size="8.5" text-anchor="end" class="svg-label">${hRect}cm</text>
        <text x="${cx3 + 4}" y="${(ya3b + yr3b) / 2 + 3}" font-size="8.5" class="svg-label">${hTri}cm</text>
      `;

      // 大問4：平行四辺形または直角三角形の角柱（毎回ランダム切替）
      const type4 = pickRandom(['para', 'tri']);
      let title4, vol4, exp4, prism4, base4;
      if (type4 === 'para') {
        const b4 = randInt(5, 8), h4 = randInt(3, 5), hp4 = randInt(3, 6);
        const a4 = b4 * h4;
        vol4 = a4 * hp4;
        title4 = `底面が平行四辺形で、高さが ${hp4}cm の四角柱があります。体積の求め方を式や言葉で説明し、答えを求めなさい。`;
        exp4 = `底面の平行四辺形の面積は${b4}×${h4}＝${a4}(cm²)。角柱の体積は「底面積×高さ」なので、${a4}×${hp4}＝${vol4} になります。`;
        const sc4 = Math.min(44 / b4, 36 / h4);
        const W4 = b4 * sc4, H4 = h4 * sc4, skew = 11;
        const fx4 = 8, fy4 = 72;
        prism4 = prismDrawing(

          makeAnsPage(1, 'No.1〜4', ans1) +
          makeAnsPage(2, 'No.5〜8', ans2) +
          makeAnsPage(3, 'No.9〜12', ans3);

        applyFilter(currentFilter);
      } catch (err) {
        console.error('プリント生成エラー:', err);
      }
    }

    function applyFilter(filterVal) {
      currentFilter = filterVal;
      document.querySelectorAll('.a4-sheet').forEach(s => {
        const u = s.getAttribute('data-unit');
        if (filterVal === 'all' || u === filterVal) {
          s.classList.remove('sheet-hidden-by-filter');
          s.style.display = 'flex';
        } else {
          s.classList.add('sheet-hidden-by-filter');
          s.style.display = 'none';
        }
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        const f = btn.getAttribute('data-filter');
        if (f === filterVal) {
          btn.classList.remove('bg-slate-800', 'text-slate-200', 'bg-rose-900/80', 'text-rose-100');
          btn.classList.add('bg-amber-400', 'text-slate-950', 'font-bold');
        } else {
          btn.classList.remove('bg-amber-400', 'text-slate-950', 'font-bold');
          if (f === 'ans') {
            btn.classList.add('bg-rose-900/80', 'text-rose-100');
          } else {
            btn.classList.add('bg-slate-800', 'text-slate-200');
          }
        }
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAllSheets();

      document.getElementById('btn-regenerate').addEventListener('click', () => {
        renderAllSheets();
        showToast('新しい数値で全15ページを作り直しました！');
      });

      const btnAns = document.getElementById('btn-toggle-ans');
      const ansLabel = document.getElementById('toggle-ans-label');
      btnAns.addEventListener('click', () => {
        document.body.classList.toggle('hide-inline-ans');
        const isHidden = document.body.classList.contains('hide-inline-ans');
        ansLabel.textContent = isHidden ? '赤字解答：OFF' : '赤字解答：ON';
        btnAns.classList.toggle('bg-rose-700', !isHidden);
        btnAns.classList.toggle('bg-slate-700', isHidden);
      });

      document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyFilter(btn.getAttribute('data-filter'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      document.getElementById('unit-jump').addEventListener('change', (e) => {
        const val = e.target.value;
        if (!val) return;
        if (currentFilter !== 'all') {
          applyFilter('all');
        }
        const el = document.getElementById(`sheet-${val}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        e.target.value = '';
      });
    });
  </script>
</body>
</html>
